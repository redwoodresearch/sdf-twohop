[project]
name = "sdf-twohop"
version = "0.1.0"
description = "Research code for studying no-CoT two-hop reasoning on SDF'd facts versus pretrained facts"
readme = "README.md"
authors = [
    { name = "GabrielKS", email = "23368820+GabrielKS@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tinker>=0.32",
    "tinker-cookbook>=0.5.7",
    "tqdm>=4.70.1",
    "unidecode>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
